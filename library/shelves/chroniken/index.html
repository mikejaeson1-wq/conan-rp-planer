<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bücherregal</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#26364b,#0c1119 65%);color:#f7f3ec;font:16px system-ui,sans-serif}header,main{width:min(1080px,92vw);margin:auto}header{padding:64px 0 28px}h1{font:700 clamp(2rem,7vw,4rem) Georgia,serif;margin:.2em 0;color:#f0c56b}.sub{color:#b9c5d4;max-width:720px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;padding:20px 0 64px}.tile{background:rgba(18,27,40,.9);border:1px solid #53657b;border-radius:18px;padding:22px;color:inherit;text-decoration:none;box-shadow:0 18px 45px #0005}.tile:hover{border-color:#f0c56b;transform:translateY(-2px)}small{color:#b9c5d4}audio{width:100%;margin-top:14px}.tracks{display:grid;gap:12px}.track{padding:14px;border-radius:12px;background:#ffffff0b}button{background:#f0c56b;color:#17120b;border:0;border-radius:10px;padding:10px 14px;font-weight:700}footer{padding:24px 0 50px;color:#97a5b7}</style></head><body><header><small>CONAN RP-PLANER · made by Elion</small><h1>Bücherregal</h1><p class="sub">Geschichten, Tagebücher und Lore</p></header><main><div class="grid"><p>Noch keine veröffentlichten Bücher in diesem Regal.</p></div><footer>Deine Welt – deine Geschichten – gemeinsam geplant.</footer></main></body></html>
