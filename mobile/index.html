<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151d28">
  <meta name="description" content="Conan RP-Planer Mobile Companion 270 mit Terminen">
  <meta name="mobile-version" content="270.0.1">
  <link rel="manifest" href="manifest.webmanifest?v=270.0.1">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css?v=270.0.1">
  <title>Conan RP Mobile 270</title>
</head>
<body>
  <main class="shell">
    <header class="brand"><img src="icon.svg" alt=""><div><h1>Conan RP-Planer</h1><small>Mobile Companion 270 · made by Elion</small></div><span id="connectionBadge" class="badge">Offline</span></header>
    <section id="authView">
      <div class="card hero"><img src="icon.svg" alt=""><h2>Deine Welt unterwegs</h2><p class="muted">Dasselbe Konto wie am Desktop. Deine E-Mail-Adresse wird anderen Nutzern niemals angezeigt.</p></div>
      <div class="tabs auth-tabs"><button data-auth="login" class="active">Anmelden</button><button data-auth="register">Konto erstellen</button><button data-auth="recover">Passwort vergessen</button></div>
      <form id="loginForm" class="card auth-panel active" data-auth-panel="login"><label>E-Mail<input name="email" type="email" autocomplete="email" required></label><label>Passwort<input name="password" type="password" autocomplete="current-password" required></label><button class="primary wide">Anmelden</button></form>
      <form id="registerForm" class="card auth-panel" data-auth-panel="register"><label>Anzeigename<input name="display_name" maxlength="60" required></label><label>E-Mail<input name="email" type="email" autocomplete="email" required></label><label>Passwort<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><button class="primary wide">Konto erstellen</button></form>
      <form id="recoverForm" class="card auth-panel" data-auth-panel="recover"><label>E-Mail<input name="email" type="email" autocomplete="email" required></label><button class="primary wide">Passwort-Mail senden</button></form>
      <p id="authStatus" class="status"></p>
    </section>
    <section id="appView" class="hidden"><div id="page"></div><nav class="bottom-nav"><button data-page="home" class="active">⌂<br>Heute</button><button data-page="appointments">◷<br>Termine</button><button data-page="chats">✉<br>Chats</button><button data-page="clans">♜<br>Clans</button><button data-page="security">⚿<br>Sicher</button></nav></section>
  </main>
  <input id="keyFile" type="file" accept=".crpkey,application/json" hidden>
  <input id="chatFile" type="file" accept="image/*,audio/*,.pdf,.txt" hidden>
  <script src="app.js?v=270.0.1"></script>
</body>
</html>
